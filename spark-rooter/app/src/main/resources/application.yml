server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

spark:
  selfcheck:
    enabled: true
  permissions:
    # 显式列表；不要改回 Map<"user@tenant", [...]>：宽松绑定会吞掉 "@" 与 ":"（见 InMemoryPrincipalPermissionResolver）
    grants:
      - userId: user_001
        tenantId: tenant_001
        permissions: ["order:read", "order:delete", "product:read", "aftersale:read", "aftersale:create", "refund:read", "refund:create"]
      - userId: user_002
        tenantId: tenant_001
        permissions: ["order:read", "product:read", "aftersale:read", "refund:read"]
