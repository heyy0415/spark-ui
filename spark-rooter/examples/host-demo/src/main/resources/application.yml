server:
  port: 8080
  # SIGTERM 后先停止接新连接，等在飞的 Run / SSE 收尾再退出；配合下面的 timeout-per-shutdown-phase
  shutdown: graceful
  tomcat:
    # 请求体上限：intent-request.message 契约已限 2000 字符，这里防的是非契约路径（如直调 /internal/**）
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB

spring:
  lifecycle:
    # 一次规划 + 三步工具链实测 < 30s；超过说明有请求卡死，不值得再等
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        # metrics 供 spark.* 指标查询（Micrometer 已随 actuator 装配）；生产按需再收窄
        include: health,metrics
  endpoint:
    health:
      # 把 K8s 探针端点分成 liveness / readiness 两组
      probes:
        enabled: true
      group:
        readiness:
          # sparkRooter 指示器：模型没配 → DOWN → 不接流量。熔断只进 detail 不改状态（starter 的 HealthBeans 写了为什么）
          include: readinessState,sparkRooter
      # 注意根 /actuator/health 聚合全部指示器，没配模型时它也是 DOWN。重启类探针（Docker HEALTHCHECK、K8s liveness）
      # 请打 /actuator/health/liveness——模型没配是「不接流量」不是「进程坏了」，用根端点会让容器被反复重启
      show-details: always
  health:
    redis:
      # host-demo 引了 spark-rooter-redis 以便演示多副本；默认 memory 形态下 Redis 可能根本没起，
      # 不能让 actuator 自带的 Redis 探针把 health 打成 DOWN。redis profile 里再打开
      enabled: false

spark:
  selfcheck:
    enabled: true          # 示例宿主打开启动自检（生产建议关）
  web:
    internal-endpoints: true   # 开 /internal/** 供 e2e 直调 Registry / Gateway
  runtime:
    # starter 默认拒绝在没有宿主 SessionIdResolver 时启动。示例宿主显式打开演示实现（sessionId = conversationId，无会话隔离）：
    # 本文档对 default / e2e / e2e-ttl 三种启动都生效；e2e profile 下 DemoSessionIdResolver（@Profile("e2e")）顶替演示实现，
    # e2e-ttl 与 Docker / deploy-verify 的无 profile 启动依赖这个开关并在日志 WARN。生产宿主不要复制这一行。
    demo-session-resolver: true
  # 模型是必需依赖：三项任一缺失 → 启动 WARN，所有请求返回「未配置模型，无法理解请求」。
  # 值留空，用环境变量 SPARK_LLM_BASE_URL / SPARK_LLM_API_KEY / SPARK_LLM_MODEL 注入；不要把密钥写进本文件。
  llm:
    base-url: ${SPARK_LLM_BASE_URL:}      # OpenAI 兼容接口，如 https://api.openai.com/v1 或网关地址
    api-key: ${SPARK_LLM_API_KEY:}
    model: ${SPARK_LLM_MODEL:}

---
spring:
  config:
    activate:
      on-profile: e2e-ttl
spark:
  runtime:
    memory-ttl: 1s         # e2e ㉓：会话记忆 1s 过期

---
# 多副本形态：四个状态存储走 Redis。两个 hub 副本配同一个 Redis 即可互相接力（e2e-multi-instance.sh 验证）。
spring:
  config:
    activate:
      on-profile: redis
  data:
    redis:
      host: ${SPARK_REDIS_HOST:127.0.0.1}
      port: ${SPARK_REDIS_PORT:6379}
      database: ${SPARK_REDIS_DB:0}
spark:
  storage:
    type: redis
management:
  health:
    redis:
      enabled: true
