packages:
  - 'packages/*'
  - 'apps/*'

# 统一版本真源：core 的 peer/devDeps 与 chat 的 deps 都写 "catalog:"，防两处漂移（spec §2.1）
catalog:
  react: 19.2.8
  react-dom: 19.2.8
  antd: 6.6.2
  antd-mobile: 5.42.3
  zod: ^4.5.4
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.5
  vite: 8.2.2
  '@vitejs/plugin-react': ^6.1.1
  typescript: 7.0.2
  # 单元测试：vitest 5 要求 Node 22+（engines 与 optional peer @types/node），本仓库 Node 20 / @types/node ^20，钉 4.1.x
  vitest: 4.1.11

# strict-peer-dependencies=true 下的已知例外：antd-mobile 5.42 的传递依赖（@react-spring/*、staged-components）只声明 react ≤18，
# 实际在 React 19 上可用（首期已验证）。放行 react / react-dom 的 peer 版本判定；本仓库自己包的其它 peer 仍然严格。
peerDependencyRules:
  allowedVersions:
    '@react-spring/*>react': '19'
    '@react-spring/*>react-dom': '19'
    'staged-components>react': '19'
