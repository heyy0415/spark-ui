name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新推送取消旧运行：e2e 耗时较长，不必让过期的运行占着 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # change-dir 要求「恰一个非 DONE 的 change」，CI 上通常有多个 → 必须显式指定
  # 详见 .harness/changes/ci-run/summary.md
  SPARK_CHANGE: ci-run
  # 后端与前端 dev server 的端口：CI runner 上独占，与本机约定保持一致
  SPARK_PORT: '8091'
  SPARK_FRONT_PORT: '5199'

jobs:
  gates:
    name: 门禁（契约 / 依赖 / 单测 / 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: |
            spark-ui/pnpm-lock.yaml
            .harness/pnpm-lock.yaml

      - name: 安装依赖
        run: |
          pnpm -C spark-ui install --frozen-lockfile
          pnpm -C .harness install --frozen-lockfile

      # ci.mjs 的 host-demo 步骤用 `mvn -o`（离线，证明只依赖本地仓）。host-demo 的 parent 是外部的
      # spring-boot-starter-parent，且要用 spring-boot-maven-plugin —— 缓存为空时这两者不在
      # `spark-rooter install` 的下载范围内，`-o` 会直接失败。先联网解析一次把它们放进 ~/.m2。
      - name: 预热 host-demo 的 parent 与插件（供后续 mvn -o 使用）
        working-directory: spark-rooter/examples/host-demo
        run: mvn -q -B -DskipTests dependency:resolve-plugins

      # 全量门禁：check-rename / check-contracts / check-module-deps / check-seed /
      # check-log-assertions / check-shell / spark-ui ci / spark-rooter install / host-demo 离线打包
      - name: pnpm -C .harness run ci
        run: pnpm -C .harness run ci

      - name: pnpm -C .harness run doctor
        run: pnpm -C .harness run doctor

      # e2e 与 deploy-verify 都需要 host-demo.jar 与前端 dist，避免两个 job 各自重建
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          retention-days: 1
          if-no-files-found: error
          path: |
            spark-rooter/examples/host-demo/target/host-demo.jar
            spark-ui/apps/chat/dist
            spark-ui/packages/core/dist

  e2e:
    name: 端到端（后端 + 前端）
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: |
            spark-ui/pnpm-lock.yaml
            .harness/pnpm-lock.yaml

      - name: 安装依赖
        run: |
          pnpm -C spark-ui install --frozen-lockfile
          pnpm -C .harness install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: build-output
          # 显式还原到仓库根：upload 的三个 path 以仓库根为公共前缀，
          # 不写 path 时 v4 的推导结果依赖前缀形状，写死更稳
          path: .

      # 浏览器按 @playwright/test 版本缓存；.harness 的 playwright 必须同版本（harness-doctor 有检查）
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('spark-ui/package.json') }}

      - name: 安装 chromium
        run: pnpm -C spark-ui run e2e:install

      # 不设 SPARK_LLM_*：一律走 host-demo 的 e2e profile 假规划器。
      # 验的是校验边界 / 编排 / 网关 / 领域 / 前端渲染；模型理解质量需真 key，不在 CI 覆盖范围。
      - name: e2e-backend
        run: bash .harness/scripts/e2e-backend.sh

      - name: e2e-frontend
        run: bash .harness/scripts/e2e-frontend.sh

      - name: 上传 e2e 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-deployment
          retention-days: 7
          if-no-files-found: warn
          path: .harness/changes/ci-run/deployment

  deploy-verify:
    name: 部署验证
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: |
            spark-ui/pnpm-lock.yaml
            .harness/pnpm-lock.yaml

      - name: 安装依赖
        run: |
          pnpm -C spark-ui install --frozen-lockfile
          pnpm -C .harness install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: build-output
          # 显式还原到仓库根：upload 的三个 path 以仓库根为公共前缀，
          # 不写 path 时 v4 的推导结果依赖前缀形状，写死更稳
          path: .

      # preview-console.mjs 用 .harness 的 playwright（与 spark-ui 同版本，共用同一份 chromium）
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('spark-ui/package.json') }}

      - name: 安装 chromium
        run: pnpm -C spark-ui run e2e:install

      # 无 SPARK_LLM_API_KEY → 脚本自动加 e2e profile 并打印 planner=fake-e2e
      - name: deploy-verify
        run: bash .harness/scripts/deploy-verify.sh

      - name: 上传部署验证产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-verify-deployment
          retention-days: 7
          if-no-files-found: warn
          path: .harness/changes/ci-run/deployment
